<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Waste Collection</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash-screen" class="splash-screen">
    <div class="splash-content">
      <h1 class="splash-title">Smart<span style="font-weight: 300;">Route</span></h1>
      <p class="splash-subtitle">Waste Collection Network</p>
      <button id="open-route-btn" class="splash-btn">Open Route</button>
    </div>
  </div>

  <div id="map"></div>
  
  <div class="uber-panel">
    <h1>Smart Routing</h1>
    <div class="status-bar" id="status-text">Click on the map to add bins.</div>
    
    <div class="controls-section">
      <div class="form-group">
        <label>Start (Depot)</label>
        <select id="start-node"></select>
      </div>
      <div class="form-group">
        <label>End (Optional)</label>
        <select id="end-node"></select>
      </div>
      
      <div class="form-group">
        <label>Algorithm</label>
        <select id="method">
          <option value="nearest_neighbor">Greedy Nearest Neighbor</option>
          <option value="tsp_approx">TSP Approximation</option>
        </select>
      </div>
      
      <div class="checkbox-group">
        <input type="checkbox" id="priority-mode" />
        <label for="priority-mode">Next click adds Priority Bin (Full)</label>
      </div>
      
      <div class="actions">
        <button id="route-btn" class="btn-primary">Calculate Route</button>
        <button id="clear-btn" class="btn-secondary">Clear Map</button>
      </div>
    </div>
    
    <div id="output-box" class="output-panel">
      <!-- Results will appear here -->
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
